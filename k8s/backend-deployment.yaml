apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: devdocs-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: devdocs-config }
            - secretRef: { name: devdocs-secrets }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: rag-index
              mountPath: /app/data/index
              readOnly: true
      volumes:
        - name: rag-index
          persistentVolumeClaim: { claimName: rag-index-pvc }
