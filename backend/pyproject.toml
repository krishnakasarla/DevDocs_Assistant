[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devdocs-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for DevDocs Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "certifi>=2024.8.30",
  "pymongo>=4.9,<5",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "sentence-transformers>=3.1,<4",
  "faiss-cpu>=1.8,<2",
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "mongomock>=4.3,<5",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.coverage.run]
source = ["app"]
branch = true
