<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DevDocs Assistant architecture</title>
  <desc id="desc">Documentation flows through ingestion to MongoDB and FAISS. React queries FastAPI retrieval and QA services, which call Groq or Ollama. Bitbucket pushes images to ECR for Kubernetes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.accent{fill:#eef2ff;stroke:#6366f1}.data{fill:#ecfdf5;stroke:#10b981}.deploy{fill:#fff7ed;stroke:#f97316}.label{font:700 18px system-ui;fill:#172033}.small{font:14px system-ui;fill:#526078}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.group{fill:#f8fafc;stroke:#e2e8f0;stroke-width:2;rx:22}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f1f5f9"/>
  <text x="56" y="60" class="label" style="font-size:28px">DevDocs Assistant</text>
  <text x="56" y="86" class="small">Retrieval-augmented Q&amp;A and delivery architecture</text>
  <rect x="42" y="120" width="1116" height="390" class="group"/>
  <rect x="70" y="185" width="150" height="95" class="box"/><text x="145" y="220" text-anchor="middle" class="label">Docs</text><text x="145" y="247" text-anchor="middle" class="small">FastAPI + MongoDB</text>
  <rect x="280" y="175" width="180" height="115" class="box accent"/><text x="370" y="213" text-anchor="middle" class="label">Ingestion</text><text x="370" y="238" text-anchor="middle" class="small">header chunking</text><text x="370" y="259" text-anchor="middle" class="small">MiniLM embeddings</text>
  <rect x="520" y="145" width="165" height="90" class="box data"/><text x="602" y="180" text-anchor="middle" class="label">MongoDB</text><text x="602" y="205" text-anchor="middle" class="small">text + metadata</text>
  <rect x="520" y="265" width="165" height="90" class="box data"/><text x="602" y="300" text-anchor="middle" class="label">FAISS</text><text x="602" y="325" text-anchor="middle" class="small">normalized vectors</text>
  <rect x="755" y="160" width="190" height="180" class="box accent"/><text x="850" y="197" text-anchor="middle" class="label">FastAPI</text><text x="850" y="226" text-anchor="middle" class="small">RetrievalService</text><text x="850" y="250" text-anchor="middle" class="small">QAService</text><text x="850" y="274" text-anchor="middle" class="small">LLMProvider</text><text x="850" y="308" text-anchor="middle" class="small">Groq ↔ Ollama</text>
  <rect x="1000" y="190" width="130" height="100" class="box"/><text x="1065" y="228" text-anchor="middle" class="label">React</text><text x="1065" y="254" text-anchor="middle" class="small">chat + stats</text>
  <path d="M220 232 H280" class="line"/><path d="M460 215 L520 190" class="line"/><path d="M460 250 L520 300" class="line"/><path d="M685 190 H755" class="line"/><path d="M685 310 L755 285" class="line"/><path d="M1000 240 H945" class="line"/><text x="972" y="226" text-anchor="middle" class="small">HTTP</text>
  <path d="M755 320 C700 410 530 410 530 355" class="line"/><text x="650" y="414" text-anchor="middle" class="small">persist sessions and messages</text>
  <rect x="42" y="545" width="1116" height="125" class="group"/>
  <rect x="78" y="570" width="190" height="72" class="box deploy"/><text x="173" y="600" text-anchor="middle" class="label">Bitbucket</text><text x="173" y="623" text-anchor="middle" class="small">lint · test · build</text>
  <rect x="420" y="570" width="150" height="72" class="box deploy"/><text x="495" y="613" text-anchor="middle" class="label">AWS ECR</text>
  <rect x="735" y="570" width="190" height="72" class="box deploy"/><text x="830" y="600" text-anchor="middle" class="label">Kubernetes</text><text x="830" y="623" text-anchor="middle" class="small">deployments + ingress</text>
  <rect x="1000" y="570" width="120" height="72" class="box deploy"/><text x="1060" y="613" text-anchor="middle" class="label">Users</text>
  <path d="M268 606 H420" class="line"/><path d="M570 606 H735" class="line"/><path d="M925 606 H1000" class="line"/>
</svg>
